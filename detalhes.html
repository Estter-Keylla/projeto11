
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes do evento | Culturama</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <header class="cabecalho">

        <a href="../index.html" class="logo">▦ Culturama</a>

        <nav>
            <a href="../index.html">Início</a>
            <a href="../eventos.html"> class="ativo">Eventos</a>
        </nav>

        <a href="../favoritos.html" class="usuario">♡</a>

    </header>


    <main class="container pagina-detalhes">

        <a href="../eventos.html" class="voltar">
            ← Voltar aos eventos
        </a>

        <!-- Informações preenchidas pelo JavaScript -->
        <div id="detalhe-evento"></div>


        <!-- COMENTÁRIOS -->
        <section class="painel">

            <h2>Comentários da comunidade</h2>

            <form id="form-comentario" class="formulario">

                <label>
                    Compartilhe sua experiência

                    <textarea
                        id="texto-comentario"
                        rows="3"
                        required
                    ></textarea>
                </label>

                <button class="botao-principal" type="submit">
                    Enviar comentário
                </button>

            </form>

            <div id="lista-comentarios"></div>

        </section>


        <!-- INSCRIÇÃO DE ARTISTAS -->
        <section class="painel">

            <h2>🎤 É artista? Candidate-se!</h2>

            <p>
                Demonstre seu interesse em participar deste evento.
            </p>

            <form id="form-inscricao-artista" class="formulario">

                <label>
                    Nome artístico
                    <input name="artista" required>
                </label>

                <label>
                    Especialidade
                    <input
                        name="especialidade"
                        placeholder="Cantor, DJ, atriz..."
                        required
                    >
                </label>

                <label>
                    Link do portfólio
                    <input name="portfolio" type="url">
                </label>

                <button class="botao-principal" type="submit">
                    Enviar inscrição
                </button>

            </form>

        </section>

    </main>


    <footer class="rodape">
        <p>© 2026 Culturama</p>
    </footer>

</body>
</html>
